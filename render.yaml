databases:
  - name: saltmarsh-db
    plan: free

services:
  - type: web
    name: saltmarsh-orders
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm run web
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: saltmarsh-db
          property: connectionString

  - type: worker
    name: saltmarsh-worker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: saltmarsh-db
          property: connectionString
