# Local development only: a throwaway Postgres and Redis for running the web API, the worker
# and the nightly job on your own machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: saltmarsh
      POSTGRES_PASSWORD: saltmarsh
      POSTGRES_DB: saltmarsh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
